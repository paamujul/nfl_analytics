# Coaching staff by team-season, 2021-2025.
#
# HOW THIS FILE WAS BUILT, AND HOW FAR TO TRUST IT
#
# head_coach: DERIVED, ground truth. Extracted programmatically from
#   nflreadpy.load_schedules() home_coach/away_coach. Not typed from memory.
#   Where a team changed coaches mid-season the most frequent coach (the one who
#   coached the most games) is recorded and `note` describes the split.
#
# oc / dc / offensive_play_caller / defensive_play_caller: MODEL-GENERATED AND
#   UNVERIFIED. No nflverse dataset carries coordinators, so these come from the
#   author's own knowledge. They have NOT been checked against a source, and
#   NEED HUMAN REVIEW before anyone trusts play-call attribution built on them.
#   Entries the author was not confident about are deliberately left null --
#   a null is honest, whereas a wrong coordinator name looks authoritative and
#   silently misattributes every play that coach is credited with. Roughly half
#   of the coordinator fields here are null by design; do not "helpfully" fill
#   them in from memory without checking a source.
#
# offensive_play_caller / defensive_play_caller exist because the coordinator is
#   frequently NOT the play-caller -- Andy Reid, Kyle Shanahan, Sean McVay and
#   Sean Payton call their own offenses, and Todd Bowles and Brandon Staley
#   called their own defenses. Where the caller is null, sync_coaching_staff
#   falls back to the head coach and writes a sync_log row saying it did.
#
# LIMIT OF THE "DERIVED" GUARANTEE -- nflverse coach data degrades after 2023.
#   load_schedules() carries a per-game coach, so 2021-2023 genuinely surface
#   mid-season changes (8 of them, each noted below). For 2024 and 2025 it
#   records exactly ONE coach per team-season and no longer reflects in-season
#   firings at all -- verified: zero multi-coach teams in either year, against
#   three real changes in 2024 alone. So for 2024+ `head_coach` means "who
#   nflverse lists", not "who coached the most games", and the most-frequent
#   rule above silently stops applying.
#
#   The concrete cost: NYJ 2024 records Robert Saleh, who coached 5 of 17 games.
#   Jeff Ulbrich coached the other 12. Any play-call attribution for weeks 6-18
#   credits Saleh's staff for Ulbrich's games. NO and CHI have the same shape,
#   less severely. Those three rows are annotated from the author's own
#   knowledge and are UNVERIFIED like every other non-derived field here.
#
# verified: false everywhere until a human checks the row and flips it.

